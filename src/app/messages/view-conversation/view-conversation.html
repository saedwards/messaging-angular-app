<div class="messages-view-conversation" #scrollTarget>
  @if (loadError()) {
    <p class="messages-view-conversation__error" role="alert">Messages could not be loaded.</p>
  } @else if (messagesLoaded() && !messages().length) {
    <h1 class="messages-view-conversation__heading">Write a message</h1>
  }

  <div class="messages-view-conversation__list" role="log" aria-label="Conversation">
    @for (message of messages(); track message.id) {
      <div
        class="messages-view-conversation__item"
        [class.messages-view-conversation__item--you]="message.fromYou"
        [class.messages-view-conversation__item--new]="message.isNew"
      >
        <span class="messages-view-conversation__time">{{ message.sent | date: 'shortTime' }}</span>

        <div
          class="messages-view-conversation__message-animation"
          [style.border-color]="'#' + message.user.colour"
        >
          @if (message.isNew) {
            <div
              class="messages-view-conversation__message-cover"
              [style.background-color]="'#' + message.user.colour"
              (animationend)="onNewMessageAnimated(message.id)"
            ></div>
          }

          <div class="messages-view-conversation__message">
            <img class="messages-view-conversation__avatar" [src]="message.user.avatarUrl" alt="" />
            <strong class="messages-view-conversation__name">{{ message.user.name }}</strong>
            {{ message.text }}
          </div>
        </div>
      </div>
    }
  </div>
</div>
